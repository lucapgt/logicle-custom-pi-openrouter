name: Pi native runtime branch validation

on:
  push:
    branches:
      - feature/pi-native-runtime
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pi-native-runtime-${{ github.event_name }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/pi-native-runtime
          persist-credentials: true
      - uses: pnpm/action-setup@v4
        with:
          version: 10.22.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Regenerate route and migration manifests using project scripts
        run: |
          pnpm run generate:backend-route-manifest
          pnpm run generate:migration-manifest
      - name: Commit generated manifests on feature branch only
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        run: |
          if ! git diff --quiet -- apps/backend/lib/router/routes.generated.ts apps/backend/db/migrations.generated.ts; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add apps/backend/lib/router/routes.generated.ts apps/backend/db/migrations.generated.ts
            git commit -m 'chore(pi): regenerate backend route and migration manifests'
            git push origin HEAD:feature/pi-native-runtime
          fi
      - name: Typecheck entire workspace
        run: pnpm run check-types
      - name: Run backend unit tests
        run: pnpm test
      - name: Build frontend bundle
        run: pnpm run build-ci
